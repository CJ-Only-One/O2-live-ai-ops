# Argo CD에 "이 저장소의 deploy/ 를 보고 클러스터를 맞춰라"고 등록하는 리소스다.
#
# deploy/ 안에 두지 않은 이유: 그러면 Argo가 자기 자신을 관리 대상으로 삼는다.
# 이 파일은 클러스터를 세울 때 한 번만 손으로 적용하는 부트스트랩이고,
# 그 뒤로는 Argo가 deploy/ 만 따라간다. 성격이 다르므로 자리도 나눈다.
#
#   kubectl apply -f bootstrap/argocd-application.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: o2-dev
  namespace: argocd
  finalizers:
    # Application을 지울 때 배포된 리소스도 함께 정리한다.
    # 없으면 Application만 사라지고 파드는 클러스터에 남는다.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/CJ-Only-One/O2-live-ai-ops
    targetRevision: main
    path: deploy
    directory:
      # 평면 배치라 하위 디렉토리를 훑을 필요가 없다.
      # recurse를 켜두면 나중에 deploy/ 아래에 참고용 파일을 뒀을 때
      # 그것까지 클러스터에 적용하려 든다.
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    # 네임스페이스는 매니페스트가 각자 명시한다.
    # 여기에 적으면 매니페스트의 값과 어긋났을 때 원인을 찾기 어렵다.
    namespace: o2-dev

  syncPolicy:
    automated:
      # Git에 없는 리소스를 클러스터에서 지운다. GitOps의 핵심이지만,
      # 손으로 만든 리소스도 함께 지워지므로 prod에서는 다시 판단해야 한다.
      prune: true
      # kubectl로 손댄 것을 되돌린다. Git을 유일한 진실로 만드는 스위치다.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

# NOTE: 환경이 늘면 이 파일을 복사하지 말고 ApplicationSet으로 바꿀 것.
# 서비스 × 환경만큼 Application이 생기는데 손으로는 관리할 수 없다.
# prod는 automated를 끄고 수동 sync로 두는 편이 맞다.
