# Argo CD에 "매니페스트 저장소를 보고 클러스터를 맞춰라"고 등록하는 리소스다.
#
# 매니페스트는 별도 저장소(O2-live-deploy)에 있다. 이 저장소의 main은
# 브랜치 보호로 직접 푸시가 막혀 CI가 태그 갱신 커밋을 밀 수 없기 때문이다.
# 자세한 근거는 docs/decisions.md D-006 참고.
#
# 이 파일 자체는 클러스터를 세울 때 한 번만 손으로 적용하는 부트스트랩이라
# 매니페스트 저장소가 아니라 여기에 둔다 — 저쪽에 두면 Argo가 자기 자신을
# 관리 대상으로 삼게 된다.
#
#   kubectl apply -f bootstrap/argocd-application.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: o2-dev
  namespace: argocd
  finalizers:
    # Application을 지울 때 배포된 리소스도 함께 정리한다.
    # 없으면 Application만 사라지고 파드는 클러스터에 남는다.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # public 저장소라 Argo에 자격증명을 등록하지 않아도 읽는다.
    repoURL: https://github.com/CJ-Only-One/O2-live-deploy
    targetRevision: main
    path: .
    directory:
      # 평면 배치라 하위 디렉토리를 훑을 필요가 없다.
      # recurse를 켜두면 나중에 참고용 파일을 하위에 뒀을 때
      # 그것까지 클러스터에 적용하려 든다.
      recurse: false
      # README.md 는 Argo가 매니페스트로 읽지 않지만(.yaml/.yml/.json만 본다),
      # 의도를 분명히 하려고 명시해 둔다.
      exclude: 'README.md'

  destination:
    server: https://kubernetes.default.svc
    # 네임스페이스는 매니페스트가 각자 명시한다.
    # 여기에 적으면 매니페스트의 값과 어긋났을 때 원인을 찾기 어렵다.
    namespace: o2-dev

  syncPolicy:
    automated:
      # Git에 없는 리소스를 클러스터에서 지운다. GitOps의 핵심이지만,
      # 손으로 만든 리소스도 함께 지워지므로 prod에서는 다시 판단해야 한다.
      prune: true
      # kubectl로 손댄 것을 되돌린다. Git을 유일한 진실로 만드는 스위치다.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

# NOTE: 환경이 늘면 이 파일을 복사하지 말고 ApplicationSet으로 바꿀 것.
# 서비스 × 환경만큼 Application이 생기는데 손으로는 관리할 수 없다.
# prod는 automated를 끄고 수동 sync로 두는 편이 맞다.
