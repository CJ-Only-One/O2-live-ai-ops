# 로컬 개발용. 코드 수정하면 바로 반영되도록(hot reload) 소스를 볼륨으로 마운트한다.
# 배포용 Dockerfile(운영 이미지 빌드)과는 별개다. DB는 AWS MySQL을 그대로 쓴다 —
# 여기서 컨테이너로 띄우지 않으니 각 앱의 .env에 RDS 접속 정보를 채워야 한다.
services:
  api:
    build:
      context: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: ./apps/api/.env
        required: false
    volumes:
      - ./apps/api/app:/app/app
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    env_file:
      - path: ./apps/frontend/.env
        required: false
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  frontend_node_modules:
