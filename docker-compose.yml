# 로컬 개발용. 코드 수정하면 바로 반영되도록(hot reload) 소스를 볼륨으로 마운트한다.
# 배포용 Dockerfile(운영 이미지 빌드)과는 별개다.
#
# 목표는 "클러스터와 같은 모양"이다. 환경변수 이름이 ConfigMap o2-data 와 같으므로,
# 로컬에서 돌아가는 코드는 클러스터에서도 그대로 돈다.
#
# 다른 점 두 가지:
#   - Valkey 는 TLS 가 없다 (클러스터는 transit 암호화가 켜져 있다)
#   - SQS 는 없다. SQS_ORDER_QUEUE_URL 이 비면 발행을 건너뛰도록 코드에서 분기한다
services:
  # 재고 카운터·세션·Pub/Sub. 클러스터의 ElastiCache 자리를 대신한다.
  # 재고 판정(원자적 DECR)은 이것 없이는 로컬에서 시험할 수 없다.
  valkey:
    image: valkey/valkey:8-alpine
    # 클러스터의 파라미터 그룹과 같은 축출 정책을 쓴다.
    # allkeys-lru 면 메모리 압박 시 TTL 없는 재고 키까지 사라진다 (D-017).
    command: valkey-server --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"

  # 주문·상품 원본. 클러스터의 RDS 자리를 대신한다.
  # RDS 는 프라이빗 서브넷에 있고 보안 그룹이 EKS 노드로 좁혀져 있어
  # 로컬에서는 닿지 않는다 — 그래서 컨테이너로 대신 띄운다.
  mysql:
    image: mysql:8.0
    # 03-data 의 파라미터 그룹과 같은 값이다. 다르면 로컬에서는 통과한 쿼리가
    # 클러스터에서 "Illegal mix of collations" 로 깨진다 (infra/03-data/rds.tf).
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-o2local}
      MYSQL_DATABASE: ${DB_NAME:-o2}
    ports:
      - "3306:3306"

  api:
    build:
      context: ./apps/api
      # 이벤트 SDK 가 private 저장소라 빌드에 읽기 토큰이 필요하다.
      #   export SDK_REPO_TOKEN=$(gh auth token)
      secrets:
        - sdk_token
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: ./apps/api/.env
        required: false
    volumes:
      - ./apps/api/app:/app/app
      # autogenerate 로 만든 리비전이 호스트에 남아야 커밋할 수 있다.
      - ./apps/api/migrations:/app/migrations
    ports:
      - "8000:8000"
    # .env 에 값이 없어도 로컬 Valkey 를 찾도록 기본값을 준다.
    # .env 쪽이 우선이므로 개인 설정을 덮어쓰지 않는다.
    environment:
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_TLS: ${VALKEY_TLS:-false}
      DB_HOST: ${DB_HOST:-mysql}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-o2local}
      DB_NAME: ${DB_NAME:-o2}
      # 이벤트 SDK 설정. 로컬은 stdout 이라 이벤트가 파드 로그로 나간다.
      # 클러스터에서 kinesis 로 바꾸면 코드는 그대로고 목적지만 달라진다.
      O2_SERVICE: ${O2_SERVICE:-api}
      O2_SERVICE_VERSION: ${O2_SERVICE_VERSION:-local}
      O2_EVENTS_SINK: ${O2_EVENTS_SINK:-stdout}
    depends_on:
      - valkey
      - mysql

  # WebSocket 채팅. api 와 같은 Valkey 를 보고 Pub/Sub 으로 파드 간 전달을 한다.
  chat-gateway:
    build:
      context: ./apps/chat-gateway
    environment:
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_TLS: ${VALKEY_TLS:-false}
      O2_SERVICE: chat-gateway
      O2_SERVICE_VERSION: local
      # 수집단이 모르는 event_name 을 어떻게 처리하는지 확인되기 전까지 꺼둔다.
      EMIT_CHAT_EVENTS: ${EMIT_CHAT_EVENTS:-false}
    ports:
      - "8090:8080"
    depends_on:
      - valkey

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    env_file:
      - path: ./apps/frontend/.env
        required: false
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    # 개발 서버가 /api 와 /ws 를 각각 api·chat-gateway 로 넘긴다.
    # 배포의 ALB 와 같은 모양이라 코드에 개발용 분기가 생기지 않는다.
    environment:
      API_TARGET: http://api:8000
      WS_TARGET: http://chat-gateway:8080
    depends_on:
      - api
      - chat-gateway

volumes:
  frontend_node_modules:

secrets:
  # 빌드 중에만 파일로 마운트된다. ARG 로 넘기면 이미지 히스토리에 남는다.
  sdk_token:
    environment: SDK_REPO_TOKEN
