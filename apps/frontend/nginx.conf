# 클라이언트 사이드 라우팅을 쓰므로 /live/bc_1042 같은 경로에 해당하는 파일이
# 없다. 기본 설정은 그것을 404 로 돌려주는데, 그러면 주소를 직접 치거나
# 새로고침할 때만 화면이 안 뜬다 — 클릭으로 이동할 때는 멀쩡해서 늦게 드러난다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 콘텐츠 해시가 붙은 자산은 파일명이 곧 식별자라 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 나머지는 전부 index.html 로 넘긴다. 라우팅은 브라우저가 한다.
    location / {
        try_files $uri /index.html;
    }
}
