# 클라이언트 사이드 라우팅을 쓰므로 /live/bc_1042 같은 경로에 해당하는 파일이
# 없다. 기본 설정은 그것을 404 로 돌려주는데, 그러면 주소를 직접 치거나
# 새로고침할 때만 화면이 안 뜬다 — 클릭으로 이동할 때는 멀쩡해서 늦게 드러난다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 압축이 꺼져 있어 자산이 원본 크기로 나갔다. hls.js 청크만 509KB 인데
    # 압축하면 157KB 다. 재생 시작이 그만큼 늦어진다.
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;
    # 프록시가 압축본을 비압축 클라이언트에 주지 않게 한다.
    gzip_vary on;

    # 콘텐츠 해시가 붙은 자산은 파일명이 곧 식별자라 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 나머지는 전부 index.html 로 넘긴다. 라우팅은 브라우저가 한다.
    location / {
        # index.html 은 매번 검증한다. 헤더가 없으면 브라우저가 임의로 캐시하는데,
        # 그러면 낡은 index.html 이 이미 사라진 청크 이름을 가리켜 404 가 난다.
        # 배포해도 언제 반영될지 알 수 없게 되는 것이 진짜 문제다.
        # no-store 가 아니다 — 캐시는 하되 304 로 넘긴다.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
