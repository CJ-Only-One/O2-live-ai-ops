# 접속 문자열(sqlalchemy.url)을 여기 적지 않는다. env.py 가 app.core.config 의
# Settings 에서 읽는다 — 그래야 ConfigMap·Secret 으로 주입된 값을 그대로 쓰고,
# 비밀번호가 저장소에 남지 않는다.
[alembic]
script_location = migrations

# env.py 가 app.* 를 import 한다. alembic 은 콘솔 스크립트라 실행 디렉터리가
# sys.path 에 들어가지 않으므로 명시한다. K8s 마이그레이션 Job 에서도 같다.
prepend_sys_path = .

# 파일명 앞에 시각을 붙여 versions/ 가 시간순으로 정렬되게 한다.
# 리비전 해시만으로는 순서를 눈으로 못 읽는다.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
