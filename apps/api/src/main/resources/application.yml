server:
  port: 8080
  shutdown: graceful   # 종료 신호를 받으면 처리 중인 요청을 마치고 내려간다

spring:
  application:
    name: o2-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # liveness/readiness를 나눠 노출한다.
      # 쿠버네티스 probe가 둘을 구분해서 봐야 롤링 업데이트가 매끄럽다.
      probes:
        enabled: true
      show-details: never
