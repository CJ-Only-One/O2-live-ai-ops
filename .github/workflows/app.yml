name: app

# 빌드와 배포를 한 파일에서 다룬다. 다만 "배포"의 정의가 GitOps에서는 다르다.
# 이 워크플로는 EKS를 직접 건드리지 않고, 매니페스트 저장소의 이미지 태그를
# 갱신하는 커밋을 만드는 데서 끝난다. 그 커밋을 Argo CD가 읽어 클러스터에 반영한다.
#
# Actions가 kubectl apply까지 하면 Argo와 서로를 덮어쓰며 싸우고,
# CI에 클러스터 수정 권한을 줘야 해서 토큰 유출 시 노출 범위가 커진다.
on:
  pull_request:
    paths: ['apps/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  # 배포는 취소하지 않는다. 중간에 끊기면 ECR에는 이미지가 있는데
  # 매니페스트는 안 올라간 어정쩡한 상태가 남는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  YQ_VERSION: v4.44.3
  # Argo CD가 감시하는 매니페스트 저장소. deploy 잡이 여기에 커밋한다.
  DEPLOY_REPO: CJ-Only-One/O2-live-deploy

jobs:
  # apps/ 아래에서 바뀐 서비스만 골라낸다.
  # 서비스가 늘어도 워크플로를 고칠 필요가 없게 하는 것이 목적이다.
  changed:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # 최초 푸시에서 before는 전부 0인 SHA다. rev-parse는 형식만 보고
          # 이것을 통과시키므로, 객체가 실제로 존재하는지까지 확인해야 한다.
          # (확인을 생략하면 뒤의 git diff가 exit 128로 죽는다)
          CHANGED=""
          if [ -n "${BASE//0/}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" HEAD -- apps/ .github/workflows/app.yml)
          fi

          # 이 워크플로 파일 자체가 바뀌면 모든 서비스의 빌드 방식에 영향을
          # 줄 수 있다 (예: build-args 추가). apps/ 안의 개별 파일 매칭으로는
          # 이걸 못 잡으니, 이 경우 전체 재빌드로 취급한다. 이걸 놓쳐서
          # frontend용 build-arg를 추가했는데 apps/frontend가 안 바뀌었다는
          # 이유로 frontend가 재빌드 안 된 적이 있다 (수동 workflow_dispatch로
          # 넘겼음).
          WORKFLOW_CHANGED=""
          if echo "$CHANGED" | grep -q "^\.github/workflows/app\.yml$"; then
            WORKFLOW_CHANGED=1
          fi

          SERVICES=()
          for dir in apps/*/; do
            [ -d "$dir" ] || continue
            svc=$(basename "$dir")
            # 기준 커밋을 못 찾거나(최초 푸시), 수동 실행이거나, 워크플로
            # 자체가 바뀌었으면 전부 대상으로 삼는다.
            if { [ -z "$CHANGED" ] && [ "${{ github.event_name }}" != "pull_request" ]; } || [ -n "$WORKFLOW_CHANGED" ]; then
              SERVICES+=("$svc")
            elif echo "$CHANGED" | grep -q "^apps/$svc/"; then
              SERVICES+=("$svc")
            fi
          done

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "services=[]" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            printf -v J '"%s",' "${SERVICES[@]}"
            echo "services=[${J%,}]" >> "$GITHUB_OUTPUT"
          fi
          echo "대상 서비스: ${SERVICES[*]:-없음}"

  # ── 빌드 · 테스트 ────────────────────────────────────────
  # PR에서 도는 것이 핵심이다. 합치기 전에 깨진 것을 잡는 게 목적이다.
  verify:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changed.outputs.services) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      # 서비스마다 언어가 다르다. 워크플로에 목록을 박아두면 서비스를 추가할
      # 때마다 여기를 고쳐야 하므로, 디렉터리에 있는 파일을 보고 판단한다.
      #
      # 판별에 실패하면 건너뛴다. 정적 페이지처럼 빌드할 것이 없는 서비스가
      # 있고, 없는 것을 빌드하려 들면 잡 전체가 실패하기 때문이다.
      # 다만 건너뛴 서비스는 이미지가 빌드된다는 것 외에는 아무것도
      # 검증되지 않는다는 뜻이므로, 로그에 분명히 남긴다.
      - id: kind
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            LANG=python
          elif [ -f package.json ]; then
            LANG=node
          elif [ -f build.gradle.kts ]; then
            # TODO: apps/api 가 FastAPI로 교체되면 이 분기를 지운다.
            # 지금 지우면 교체 전까지 그 서비스가 무검증 상태가 된다.
            LANG=gradle
          else
            LANG=none
            echo "::warning::${{ matrix.service }} 의 언어를 판별하지 못했습니다. 검증을 건너뜁니다."
          fi
          echo "lang=$LANG" >> "$GITHUB_OUTPUT"
          echo "판별: $LANG"

      # ── Python (FastAPI) ──────────────────────────────────
      - if: steps.kind.outputs.lang == 'python'
        uses: actions/setup-python@v5
        with:
          # 컨테이너의 파이썬과 같은 버전이어야 한다. Dockerfile을 바꾸면
          # 여기도 같이 바꿀 것. 다르면 여기서 통과한 코드가 런타임에 깨진다.
          python-version: '3.12'

      - name: Python 의존성 설치
        if: steps.kind.outputs.lang == 'python'
        run: |
          # 잠금 파일이 있으면 그것을 쓴다. 없으면 빌드마다 다른 버전이
          # 들어와 CI 통과와 운영 동작이 어긋난다.
          if [ -f uv.lock ]; then
            pip install uv
            uv sync --frozen
            echo "RUN=uv run" >> "$GITHUB_ENV"
          elif [ -f poetry.lock ]; then
            pip install poetry
            poetry install --no-interaction
            echo "RUN=poetry run" >> "$GITHUB_ENV"
          else
            echo "::warning::잠금 파일이 없습니다. 빌드 재현성이 보장되지 않습니다."
            pip install -r requirements.txt
            # `[ -f x ] && pip install` 로 쓰지 않는다. 파일이 없을 때 그 줄이
            # 마지막이면 스텝 전체가 실패한다. (bash -e 로 돌기 때문)
            if [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
            fi
            echo "RUN=" >> "$GITHUB_ENV"
          fi

      - name: Python 린트
        if: steps.kind.outputs.lang == 'python'
        run: |
          # 설정이 없으면 도구를 강요하지 않는다. 있으면 반드시 통과해야 한다.
          if $RUN ruff --version >/dev/null 2>&1; then
            $RUN ruff check .
            $RUN ruff format --check .
          else
            echo "ruff 없음 — 건너뜀"
          fi

      - name: Python 테스트
        if: steps.kind.outputs.lang == 'python'
        run: |
          if $RUN pytest --version >/dev/null 2>&1; then
            $RUN pytest -q
          else
            echo "::warning::pytest가 없습니다. 테스트 없이 배포됩니다."
          fi

      # ── Node (React) ──────────────────────────────────────
      - if: steps.kind.outputs.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.service }}/package-lock.json

      - name: Node 의존성 설치
        if: steps.kind.outputs.lang == 'node'
        run: |
          # npm ci 는 package-lock.json 을 그대로 재현한다.
          # npm install 은 잠금 파일을 갱신해버려 CI에서 쓰면 안 된다.
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json 이 없습니다. 빌드 재현성이 보장되지 않습니다."
            npm install
          fi

      - name: Node 검사
        if: steps.kind.outputs.lang == 'node'
        run: |
          # package.json 에 있는 스크립트만 돌린다. 없는 것을 부르면 실패한다.
          #
          # `has x && npm run x || echo` 로 쓰면 안 된다. 스크립트가 존재하는데
          # 실패한 경우까지 || 가 삼켜서 검사가 통과한 것처럼 보인다.
          has() { node -e "process.exit(require('./package.json').scripts?.['$1']?0:1)"; }

          if has lint; then npm run lint; else echo "lint 스크립트 없음 — 건너뜀"; fi
          if has test; then npm test;     else echo "::warning::test 스크립트가 없습니다. 테스트 없이 배포됩니다."; fi

          # 빌드는 반드시 돈다. 프론트는 여기서 깨지는 것을 잡는 게 핵심이다.
          npm run build

      # ── Gradle (교체 예정) ────────────────────────────────
      - if: steps.kind.outputs.lang == 'gradle'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.kind.outputs.lang == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          # 포크 PR이 캐시를 오염시키지 못하게 한다.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Gradle 빌드 + 테스트
        if: steps.kind.outputs.lang == 'gradle'
        run: gradle build --no-daemon

      # 언어마다 리포트가 나오는 위치가 다르다. 전부 적고 없는 것은 무시한다.
      - name: 테스트 리포트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.service }}
          path: |
            apps/${{ matrix.service }}/build/reports/tests/
            apps/${{ matrix.service }}/htmlcov/
            apps/${{ matrix.service }}/junit.xml
            apps/${{ matrix.service }}/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── 이미지 빌드 · 스캔 · ECR ─────────────────────────────
  image:
    needs: [changed, verify]
    if: github.event_name != 'pull_request' && needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write        # OIDC로 AWS 역할을 빌린다
      security-events: write # 스캔 결과를 Code Scanning에 올린다
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changed.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      # 장기 액세스 키를 저장소에 두지 않는다.
      # 앱 배포용 역할은 ECR push 권한만 갖는다 — Terraform 역할과 분리되어 있다.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 아래 세 단계가 같은 이름을 쓴다. 한 곳에서 정해두고 참조한다.
      - name: 이미지 이름 확정
        run: |
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/o2/${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # 빌드와 푸시를 나눈 이유는 스캔을 그 사이에 끼우기 위해서다.
      # push: true 로 한 번에 끝내면 스캔 결과를 이미지가 ECR에 올라간
      # 뒤에 보게 되어, 막을 기회 자체가 사라진다.
      #
      # load: true 는 만든 이미지를 러너의 도커 데몬에 올린다. 그래야
      # Trivy가 레지스트리를 거치지 않고 로컬에서 바로 열어볼 수 있다.
      - name: 빌드
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: false
          load: true
          # 커밋 SHA 태그 하나만 민다. latest는 아무도 참조하지 않는데
          # 저장소를 IMMUTABLE로 바꾸는 순간 두 번째 푸시부터 실패한다.
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Vite의 VITE_* 값은 런타임이 아니라 빌드 시점에 번들에 박힌다.
          # frontend는 api와 같은 ALB의 /api 경로를 상대경로로 그냥 부르면
          # 되므로(도메인을 몰라도 됨), 값 자체가 고정 상수다.
          # frontend가 아닌 서비스에는 안 쓰는 인자라 빈 값이 그냥 무시된다.
          build-args: |
            VITE_API_BASE_URL=${{ matrix.service == 'frontend' && '/api' || '' }}
          # 이벤트 SDK가 private 저장소라 pip이 인증을 필요로 한다.
          # build-args가 아니라 secrets로 넘긴다 — build-args는 이미지
          # 히스토리에 남아 `docker history`로 읽힌다.
          # 이 시크릿을 쓰지 않는 서비스의 Dockerfile은 그냥 무시한다.
          secrets: |
            sdk_token=${{ secrets.SDK_REPO_TOKEN }}

      # ECR에도 스캔(scan_on_push)이 켜져 있지만 그쪽은 BASIC이라
      # Alpine 패키지만 본다. 정작 위험이 모이는 곳은 app.jar 안의 Java
      # 의존성인데 거기는 열어보지 않는다. Trivy는 JAR을 풀어 그 안까지
      # 본다 — Log4Shell 같은 것이 걸리는 자리가 여기다.
      - name: 이미지 취약점 스캔
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          # 시크릿 검사는 gitleaks(scan.yml)가 이미 한다. 중복을 피한다.
          scanners: vuln
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          # 아직 패치가 없는 취약점으로 배포를 막으면 손쓸 방법이 없다.
          # 올릴 버전이 존재하는 것만 본다.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # 이게 없으면 severity로 걸러도 SARIF에는 LOW/MEDIUM까지 전부
          # 들어가 Security 탭이 잠긴다. 기본값이 꺼짐이라 명시해야 한다.
          limit-severities-for-sarif: true
          # 이 단계는 보고만 한다. 차단은 아래 단계가 따로 맡는다.
          exit-code: '0'

      # 결과를 워크플로 아티팩트로 두면 zip을 받아 열어봐야 해서 아무도
      # 보지 않는다. Code Scanning에 올리면 Security 탭에 쌓이고 PR에
      # 인라인으로 붙으며, 고쳐지면 알아서 닫힌다. public 저장소라 무료다.
      - name: 스캔 결과를 Code Scanning으로
        # 스캔이 취약점을 찾아 실패하더라도 결과는 올려야 한다.
        # 파일 존재를 함께 보는 이유는 빌드가 깨진 경우 SARIF가 없어서다.
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          # 서비스마다 category를 나눈다. 같은 값으로 올리면 매트릭스
          # 잡들이 서로의 결과를 덮어써 마지막 하나만 남는다.
          category: trivy-${{ matrix.service }}

      # ── 차단 ────────────────────────────────────────────
      # 보고와 차단을 나눈 이유는 기준이 다르기 때문이다.
      #
      # 보고는 HIGH까지 본다. 지금 베이스 이미지에 HIGH가 몇 건 있고,
      # 그건 우리가 고칠 수 있는 것이 아니라 temurin이 갱신해야 사라진다.
      # 그것으로 배포를 막으면 우리가 손쓸 수 없는 이유로 배포가 서고,
      # 결국 스캔을 끄는 쪽으로 간다.
      #
      # 차단은 CRITICAL만 본다. 이건 대개 의존성 한 줄로 고쳐진다.
      #
      # 한 단계로 합칠 수도 있지만, 그러면 limit-severities-for-sarif
      # 때문에 Security 탭에서 HIGH가 통째로 사라진다. 보이는 것과
      # 막는 것을 같은 값으로 묶을 수 없어 단계를 나눈다.
      - name: CRITICAL 취약점 차단
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
          # 위 단계가 이미 설치하고 DB도 받아뒀다. 다시 받지 않는다.
          skip-setup-trivy: true

      # 여기까지 왔다는 것은 CRITICAL이 없다는 뜻이다.
      # 위 단계가 실패하면 이 단계는 실행되지 않아 이미지가 ECR에 올라가지 않는다.
      - name: ECR에 푸시
        run: docker push "$IMAGE"

  # ── 배포 요청 ────────────────────────────────────────────
  # 여기가 GitOps의 이음매다. 이 커밋이 곧 배포 요청이 된다.
  #
  # 커밋 대상은 이 저장소가 아니라 매니페스트 전용 저장소다.
  # 이 저장소의 main은 브랜치 보호로 직접 푸시가 막혀 있고, 우회 권한을 주면
  # 배포마다 봇 커밋이 쌓여 사람 커밋과 뒤섞인다. 코드와 배포 기록은
  # 생명주기가 다르므로 저장소를 나눴다. (docs/decisions.md D-006)
  #
  # 서비스마다 커밋을 만들면 병렬 잡이 서로 밀어내며 충돌하므로,
  # 이미지가 전부 올라간 뒤 단일 잡에서 한 번에 갱신한다.
  deploy:
    needs: [changed, image]
    if: github.event_name != 'pull_request' && needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 이 저장소에는 더 이상 쓰지 않는다. 쓰기는 배포 저장소에만,
      # 그것도 그 저장소 하나로 범위가 묶인 토큰으로 한다.
      contents: read
      id-token: write
    steps:
      # 앱 소스는 필요 없다. 배포 저장소만 받아 태그를 고친다.
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: manifests

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 평면 배치라 kustomize가 없다. sed로 문자열을 바꾸면 주석이나
      # 비슷한 문자열까지 건드릴 수 있어, 경로를 지정해 고치는 yq를 쓴다.
      - name: yq 설치
        run: |
          curl -sSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: 이미지 태그와 버전 라벨 갱신
        working-directory: manifests
        run: |
          set -euo pipefail

          for svc in $(echo '${{ needs.changed.outputs.services }}' | tr -d '[]"' | tr ',' ' '); do
            f="${svc}-deployment.yaml"

            # 예전에는 경고만 남기고 넘어갔다. 그러면 이미지는 ECR에 올라갔는데
            # 매니페스트가 그대로여서 클러스터가 옛 버전을 계속 도는 상태가
            # 조용히 만들어진다 — 대시보드를 보지 않으면 모른다.
            if [ ! -f "$f" ]; then
              echo "::error::배포 저장소에 $f 가 없습니다. 서비스를 추가할 때 매니페스트도 같이 만들어야 합니다 (파일명 규약: <service>-deployment.yaml)."
              exit 1
            fi

            # 배열 인덱스로 고르지 않는다. 나중에 사이드카가 주입되면
            # (예: Datadog Admission Controller) 순서가 밀려 엉뚱한 컨테이너를
            # 고치게 되고, 그 실패는 런타임에만 드러난다.
            n=$(SVC="$svc" yq '[.spec.template.spec.containers[] | select(.name == strenv(SVC))] | length' "$f")
            if [ "$n" != "1" ]; then
              echo "::error::$f 에 name=$svc 컨테이너가 $n 개입니다. 정확히 하나여야 합니다."
              exit 1
            fi

            IMAGE="${{ steps.ecr.outputs.registry }}/o2/${svc}:${{ github.sha }}"
            SVC="$svc" IMAGE="$IMAGE" yq -i \
              '(.spec.template.spec.containers[] | select(.name == strenv(SVC)) | .image) = strenv(IMAGE)' "$f"

            # 버전 라벨은 있는 서비스만 갱신한다. 이벤트 SDK나 Datadog을 쓰지
            # 않는 서비스(frontend 같은 정적 서빙)에까지 요구하면, 워크플로가
            # 바뀌어 전체 재빌드가 도는 날 그 서비스에서 배포가 막힌다.
            #
            # 라벨은 Pod 템플릿에만 있다. selector.matchLabels 는 불변이라
            # 거기를 고치면 다음 apply 가 거부된다.
            LABEL_PATH='.spec.template.metadata.labels."app.kubernetes.io/version"'
            has_label=$(yq "$LABEL_PATH // \"\"" "$f")
            if [ -n "$has_label" ]; then
              VERSION="${{ github.sha }}" yq -i "$LABEL_PATH = strenv(VERSION)" "$f"
            fi

            # 여기부터는 사후 검증이다. yq 가 계산을 틀리는 경우가 아니라,
            # 선택자가 대상을 못 찾아 조용히 no-op 으로 끝나는 경우를 잡는다.
            got_image=$(SVC="$svc" yq '.spec.template.spec.containers[] | select(.name == strenv(SVC)) | .image' "$f")
            if [ "$got_image" != "$IMAGE" ]; then
              echo "::error::$f 의 이미지 갱신이 반영되지 않았습니다: $got_image"
              exit 1
            fi

            if [ -n "$has_label" ]; then
              got_version=$(yq "$LABEL_PATH" "$f")
              if [ "$got_version" != "${{ github.sha }}" ]; then
                echo "::error::$f 의 버전 라벨이 커밋 SHA 와 다릅니다: $got_version"
                exit 1
              fi
              echo "$f → $IMAGE (version=${GITHUB_SHA::7})"
            else
              echo "$f → $IMAGE (버전 라벨 없음)"
            fi
          done

      - name: 커밋
        working-directory: manifests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "이미지 태그 변화 없음 — 커밋 생략"
            exit 0
          fi
          # 저장소가 나뉘어 커밋 추적이 한 번 끊기므로,
          # 원본 커밋의 좌표를 메시지에 남겨 되짚을 수 있게 한다.
          git commit -m "deploy: 이미지를 ${GITHUB_SHA::7}로 갱신" \
                     -m "출처: ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
                     -m "실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # 사람이 그 사이에 매니페스트를 고치면 push가 거절된다.
          # 태그 한 줄만 바꾸므로 rebase로 얹으면 그만이다.
          git push || { git pull --rebase && git push; }
