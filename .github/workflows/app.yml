name: app

# 빌드와 배포를 한 파일에서 다룬다. 다만 "배포"의 정의가 GitOps에서는 다르다.
# 이 워크플로는 EKS를 직접 건드리지 않고, 매니페스트 저장소의 이미지 태그를
# 갱신하는 커밋을 만드는 데서 끝난다. 그 커밋을 Argo CD가 읽어 클러스터에 반영한다.
#
# Actions가 kubectl apply까지 하면 Argo와 서로를 덮어쓰며 싸우고,
# CI에 클러스터 수정 권한을 줘야 해서 토큰 유출 시 노출 범위가 커진다.
on:
  pull_request:
    paths: ['apps/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  # 배포는 취소하지 않는다. 중간에 끊기면 ECR에는 이미지가 있는데
  # 매니페스트는 안 올라간 어정쩡한 상태가 남는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  YQ_VERSION: v4.44.3
  # Argo CD가 감시하는 매니페스트 저장소. deploy 잡이 여기에 커밋한다.
  DEPLOY_REPO: CJ-Only-One/O2-live-deploy

jobs:
  # apps/ 아래에서 바뀐 서비스만 골라낸다.
  # 서비스가 늘어도 워크플로를 고칠 필요가 없게 하는 것이 목적이다.
  changed:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # 최초 푸시에서 before는 전부 0인 SHA다. rev-parse는 형식만 보고
          # 이것을 통과시키므로, 객체가 실제로 존재하는지까지 확인해야 한다.
          # (확인을 생략하면 뒤의 git diff가 exit 128로 죽는다)
          CHANGED=""
          if [ -n "${BASE//0/}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" HEAD -- apps/)
          fi

          SERVICES=()
          for dir in apps/*/; do
            [ -d "$dir" ] || continue
            svc=$(basename "$dir")
            # 기준 커밋을 못 찾거나(최초 푸시) 수동 실행이면 전부 대상으로 삼는다.
            if [ -z "$CHANGED" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
              SERVICES+=("$svc")
            elif echo "$CHANGED" | grep -q "^apps/$svc/"; then
              SERVICES+=("$svc")
            fi
          done

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "services=[]" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            printf -v J '"%s",' "${SERVICES[@]}"
            echo "services=[${J%,}]" >> "$GITHUB_OUTPUT"
          fi
          echo "대상 서비스: ${SERVICES[*]:-없음}"

  # ── 빌드 · 테스트 ────────────────────────────────────────
  # PR에서 도는 것이 핵심이다. 합치기 전에 깨진 것을 잡는 게 목적이다.
  verify:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changed.outputs.services) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          # 포크 PR이 캐시를 오염시키지 못하게 한다.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 모든 서비스가 JVM은 아니다. 정적 페이지처럼 빌드할 것이 없는 서비스는
      # 여기서 할 일이 없다. 없는 것을 빌드하려 들면 잡 전체가 실패한다.
      - name: 빌드 + 테스트
        run: |
          if [ ! -f build.gradle.kts ]; then
            echo "gradle 프로젝트가 아님 — 빌드 건너뜀 (이미지 빌드에서 검증된다)"
            exit 0
          fi
          gradle build --no-daemon

      - name: 테스트 리포트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.service }}
          path: apps/${{ matrix.service }}/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # ── 이미지 빌드 · ECR ────────────────────────────────────
  image:
    needs: [changed, verify]
    if: github.event_name != 'pull_request' && needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write        # OIDC로 AWS 역할을 빌린다
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changed.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      # 장기 액세스 키를 저장소에 두지 않는다.
      # 앱 배포용 역할은 ECR push 권한만 갖는다 — Terraform 역할과 분리되어 있다.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          # 커밋 SHA 태그 하나만 민다. latest는 아무도 참조하지 않는데
          # 저장소를 IMMUTABLE로 바꾸는 순간 두 번째 푸시부터 실패한다.
          tags: ${{ steps.ecr.outputs.registry }}/o2/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 배포 요청 ────────────────────────────────────────────
  # 여기가 GitOps의 이음매다. 이 커밋이 곧 배포 요청이 된다.
  #
  # 커밋 대상은 이 저장소가 아니라 매니페스트 전용 저장소다.
  # 이 저장소의 main은 브랜치 보호로 직접 푸시가 막혀 있고, 우회 권한을 주면
  # 배포마다 봇 커밋이 쌓여 사람 커밋과 뒤섞인다. 코드와 배포 기록은
  # 생명주기가 다르므로 저장소를 나눴다. (docs/decisions.md D-006)
  #
  # 서비스마다 커밋을 만들면 병렬 잡이 서로 밀어내며 충돌하므로,
  # 이미지가 전부 올라간 뒤 단일 잡에서 한 번에 갱신한다.
  deploy:
    needs: [changed, image]
    if: github.event_name != 'pull_request' && needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 이 저장소에는 더 이상 쓰지 않는다. 쓰기는 배포 저장소에만,
      # 그것도 그 저장소 하나로 범위가 묶인 토큰으로 한다.
      contents: read
      id-token: write
    steps:
      # 앱 소스는 필요 없다. 배포 저장소만 받아 태그를 고친다.
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: manifests

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 평면 배치라 kustomize가 없다. sed로 문자열을 바꾸면 주석이나
      # 비슷한 문자열까지 건드릴 수 있어, 경로를 지정해 고치는 yq를 쓴다.
      - name: yq 설치
        run: |
          curl -sSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: 이미지 태그 갱신
        working-directory: manifests
        run: |
          for svc in $(echo '${{ needs.changed.outputs.services }}' | tr -d '[]"' | tr ',' ' '); do
            f="${svc}-deployment.yaml"
            if [ ! -f "$f" ]; then
              echo "::warning::배포 저장소에 $f 가 없어 건너뜁니다. 서비스를 추가할 때 매니페스트도 같이 만들어야 합니다."
              continue
            fi
            IMAGE="${{ steps.ecr.outputs.registry }}/o2/${svc}:${{ github.sha }}" \
              yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' "$f"
            echo "$f → $IMAGE"
          done

      - name: 커밋
        working-directory: manifests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "이미지 태그 변화 없음 — 커밋 생략"
            exit 0
          fi
          # 저장소가 나뉘어 커밋 추적이 한 번 끊기므로,
          # 원본 커밋의 좌표를 메시지에 남겨 되짚을 수 있게 한다.
          git commit -m "deploy: 이미지를 ${GITHUB_SHA::7}로 갱신" \
                     -m "출처: ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
                     -m "실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # 사람이 그 사이에 매니페스트를 고치면 push가 거절된다.
          # 태그 한 줄만 바꾸므로 rebase로 얹으면 그만이다.
          git push || { git pull --rebase && git push; }
