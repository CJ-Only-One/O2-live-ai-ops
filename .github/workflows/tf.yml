name: tf

# PR에서 바뀐 스택의 plan만 돌려 무엇이 바뀔지 보여준다.
# apply는 하지 않는다 — 실제 적용은 각자 로컬에서 `terraform apply`로 하고,
# state는 S3 백엔드로 공유한다. 이 워크플로는 merge 전 diff 확인용일 뿐이다.
#
# 인프라는 코드 리뷰만으로 안전을 담보할 수 없다. plan 결과를 눈으로 보고
# "정말 이걸 지워도 되나"를 판단하는 단계가 반드시 필요하다.
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/tf.yml']

concurrency:
  group: tf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # OIDC로 AWS 역할을 빌린다
  pull-requests: write   # plan 결과를 PR에 남긴다

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'

jobs:
  # 바뀐 스택만 골라낸다. 매번 세 스택을 다 돌리면 느리고,
  # 관계없는 스택의 drift가 PR에 섞여 리뷰가 흐려진다.
  changed:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        run: |
          BASE="origin/${{ github.base_ref }}"
          # 기준 커밋을 못 찾으면(얕은 체크아웃 등) 전부 대상으로 삼는다.
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" HEAD -- infra/ || echo "infra/")
          else
            CHANGED="infra/"
          fi

          STACKS=()
          # 의존 순서를 지켜 나열한다. 01의 출력을 02가, 01을 03이 참조한다.
          # 00은 파이프라인 자신의 자격증명이라 나머지 전부보다 앞선다.
          #
          # 04-platform 은 없다. 그 스택은 plan에도 클러스터 접근이 필요한데,
          # 그러려면 CI 역할에 EKS 관리자 권한을 줘야 한다. plan은 임의 코드를
          # 실행할 수 있으므로 PR 하나가 클러스터 전체를 쥐게 된다.
          # 로컬에서 plan하고 apply한다. (docs/decisions.md D-011)
          for s in 00-cicd 01-network 02-eks 03-data; do
            # 아직 코드가 없는 스택은 건너뛴다. 이 확인이 없으면 최초 푸시처럼
            # 기준 커밋을 못 찾는 경우에 빈 디렉토리를 apply하려다 실패한다.
            if ! ls "infra/$s"/*.tf >/dev/null 2>&1; then
              continue
            fi
            if echo "$CHANGED" | grep -q "infra/$s/" || [ "$CHANGED" = "infra/" ]; then
              STACKS+=("$s")
            fi
          done

          if [ ${#STACKS[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "stacks=[]" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            printf -v JOINED '"%s",' "${STACKS[@]}"
            echo "stacks=[${JOINED%,}]" >> "$GITHUB_OUTPUT"
          fi
          echo "대상 스택: ${STACKS[*]:-없음}"

  plan:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changed.outputs.stacks) }}
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # plan에도 AWS 접근이 필요하다(기존 상태를 읽어야 하므로).
      # 이 역할은 ReadOnlyAccess다. plan은 임의 코드를 실행할 수 있으므로
      # (external data source 등) PR에서 쓰는 자격증명에 쓰기 권한을 주지 않는다.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false

      - name: 포맷 검사
        run: terraform fmt -check -recursive

      - run: terraform validate -no-color

      - name: plan
        id: plan
        run: |
          set +e
          # -lock=false: 읽기 전용 역할은 S3에 잠금 파일을 쓸 수 없다.
          # 상태를 바꾸지 않는 plan이라 잠금 없이 돌아도 안전하고,
          # 로컬 apply가 도는 중이면 그 시점의 plan이 어차피 무의미하다.
          terraform plan -input=false -no-color -lock=false -out=tfplan > plan.txt 2>&1
          CODE=$?
          set -e
          # 출력이 길면 PR 코멘트 한도를 넘긴다. 앞부분만 싣고 전문은 로그로 넘긴다.
          {
            echo "### \`${{ matrix.stack }}\` plan"
            echo '```terraform'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt
          exit $CODE

      - name: PR에 결과 남기기
        if: always()
        uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.stack }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            let body = `plan 실행에 실패했습니다. 로그를 확인해 주세요.`;
            try {
              const raw = fs.readFileSync('infra/' + process.env.STACK + '/plan.txt', 'utf8');
              body = raw.length > 55000 ? raw.slice(-55000) : raw;
            } catch (e) { /* 파일이 없으면 기본 메시지를 쓴다 */ }
            const mark = process.env.OUTCOME === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${mark} **terraform plan — \`${process.env.STACK}\`**\n\n<details><summary>결과 펼치기</summary>\n\n\`\`\`terraform\n${body}\n\`\`\`\n\n</details>`,
            });
