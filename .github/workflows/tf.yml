name: tf

# 바뀐 스택의 문법과 포맷만 검사한다. **plan은 돌리지 않는다.**
#
# 왜 plan을 뺐나 (D-023):
#   규칙이 "로컬에서 apply까지 하고 올린다"(D-005)이므로, PR 시점의 plan은
#   정상이라면 언제나 `No changes`다. "무엇이 바뀔지 미리 본다"는 목적은
#   apply한 사람이 자기 plan을 읽는 것으로 이미 달성된다.
#   CI가 사후에 같은 것을 다시 붙이면 아무도 읽지 않는 출력만 남는다.
#   D-002가 스스로 적어둔 "읽지 않는 plan은 승인 게이트의 의미를 없앤다"에 걸린다.
#
# 그리고 plan을 빼면 이 워크플로에 AWS 접근이 아예 필요 없어진다.
# 이 저장소는 public이다. PR을 열 수 있는 사람이 CI에서 코드를 실행할 수 있는
# 경로가 하나 줄어든다. D-011이 권한을 좁힌 방향의 끝이다.
#
# 코드와 실제 인프라가 어긋나는 것(드리프트)은 여기서 보지 않는다.
# PR은 코드가 바뀐 사건이고 드리프트는 시간이 흐른 사건이라, 둘을 묶으면
# 남이 만든 드리프트가 관계없는 PR을 막는다. 보려면 주기 실행으로 분리한다.
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/tf.yml']

concurrency:
  group: tf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'

jobs:
  # 바뀐 스택만 골라낸다. 매번 전부 도는 것을 막는다.
  changed:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        run: |
          BASE="origin/${{ github.base_ref }}"
          # 기준 커밋을 못 찾으면(얕은 체크아웃 등) 전부 대상으로 삼는다.
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" HEAD -- infra/ || echo "infra/")
          else
            CHANGED="infra/"
          fi

          STACKS=()
          # 04-platform 도 포함한다. plan을 안 돌리므로 클러스터 접근이
          # 필요 없어졌고, 그래서 이 스택만 검사에서 빠질 이유가 사라졌다.
          # (plan을 돌리던 시절에는 D-011의 이유로 제외했다)
          # `05`는 media가 아니라 datadog이다. media 예약(architecture.md 10.3)은
          # 쓰이지 않았고 05는 관측 스택이 되었다. 영상 스택은 `07-media`다(D-033).
          # 이름이 틀리면 아래 `ls` 검사에 걸려 조용히 건너뛴다 — 그 스택만
          # fmt·validate를 영영 안 탄다.
          for s in 00-cicd 01-network 02-eks 03-data 04-platform 05-datadog 06-agent 06-datastream 07-media 08-chat-signal; do
            # 아직 코드가 없는 스택은 건너뛴다.
            if ! ls "infra/$s"/*.tf >/dev/null 2>&1; then
              continue
            fi
            if echo "$CHANGED" | grep -q "infra/$s/" || [ "$CHANGED" = "infra/" ]; then
              STACKS+=("$s")
            fi
          done

          if [ ${#STACKS[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "stacks=[]" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            printf -v JOINED '"%s",' "${STACKS[@]}"
            echo "stacks=[${JOINED%,}]" >> "$GITHUB_OUTPUT"
          fi
          echo "대상 스택: ${STACKS[*]:-없음}"

  check:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changed.outputs.stacks) }}
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 포맷 검사
        run: terraform fmt -check -recursive

      # -backend=false 로 초기화한다. 프로바이더 스키마만 받으면 validate가
      # 돌고, S3 백엔드에 붙지 않으므로 AWS 자격증명이 필요 없다.
      # 대가는 backend 블록 자체의 오류를 여기서 못 잡는다는 것인데,
      # 그것은 로컬 init에서 즉시 드러난다.
      - name: 초기화 (백엔드 없이)
        run: terraform init -input=false -backend=false

      - name: 문법 검사
        run: terraform validate -no-color

      - name: Agent Entry Worker 단위 테스트
        if: matrix.stack == '06-agent'
        run: python3 -m unittest lambda/test_agent_entry_worker.py
