# irsa.tf 의 aws_iam_role.producer 와 짝을 이룸.
# role ARN 확인: terraform output -raw producer_role_arn
#
# 네임스페이스 data-stream 은 여기 없음 — Namespace 는 클러스터 범위 리소스라
# 네임스페이스 한정 access entry 로는 생성할 수 없다. EKS 팀이 선행 생성.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: o2-producer
  namespace: data-stream
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::066107819912:role/o2-producer-irsa-role
