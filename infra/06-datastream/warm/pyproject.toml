[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o2warm"
version = "0.1.0"
description = "올영라이브 AIOps Warm Path — 10초 윈도우 파생 지표 집계"
requires-python = ">=3.11"
# 계산 코어는 표준 라이브러리만 씁니다. AWS 접근 계층에서만 boto3 가 필요하고,
# Lambda 런타임에는 이미 들어 있습니다.
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
# o2events 는 계약 드리프트 검증에만 씁니다. 런타임 의존성이 아닙니다.
dev = ["pytest>=8.0", "boto3>=1.34", "o2events"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "handlers", "tests"]
