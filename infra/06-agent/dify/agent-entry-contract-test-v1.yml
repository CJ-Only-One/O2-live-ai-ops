app:
  description: >-
    agent.incident.v1 invocation contract validation only. No production source,
    team workflow, Bedrock, or remediation.
  icon: 🤖
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: O2 Agent Entry Contract Test v1
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: agent-entry-start-source-agent-entry-validate-target
      source: agent-entry-start
      sourceHandle: source
      target: agent-entry-validate
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: agent-entry-validate-source-agent-entry-output-target
      source: agent-entry-validate
      sourceHandle: source
      target: agent-entry-output
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: Required serialized agent.incident.v1 snapshot.
        selected: false
        title: 시작
        type: start
        variables:
        - default: ''
          hint: Serialized agent.incident.v1. Raw chat is forbidden.
          label: custom_alert_json
          max_length: 30000
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: custom_alert_json
        - default: ''
          hint: Similar incident summaries prepared by the Worker. Optional and untrusted.
          label: past_cases
          max_length: 6000
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: past_cases
      height: 160
      id: agent-entry-start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: |-
          import json
          import re
          from datetime import datetime

          TOP_LEVEL_FIELDS = {
              "schema_version", "event_type", "incident_id", "revision",
              "idempotency_key", "lifecycle", "analysis_reason", "opened_at",
              "updated_at", "correlation", "normalized_context", "signals",
              "guardrails"
          }
          TRIGGER_FIELDS = {
              "schema_version", "trigger_id", "source", "source_schema",
              "trigger_type", "idempotency_key", "occurred_at", "trace_id",
              "evidence", "guardrails"
          }
          GUARDRAIL_FIELDS = {
              "analysis_mode", "automatic_remediation_allowed",
              "must_preserve_uncertainty", "raw_chat_included",
              "single_incident_action_lock_required"
          }
          TRIGGER_GUARDRAILS = {
              "analysis_mode": "READ_ONLY",
              "automatic_remediation_allowed": False,
              "must_preserve_uncertainty": True,
              "raw_chat_included": False,
          }
          SOURCE_RULES = {
              "DATADOG_MONITOR": {
                  "source_schema": "datadog.alert.v1",
                  "trigger_type": "MONITOR_ALERT",
                  "evidence_fields": {
                      "event_id", "cycle_key", "monitor_id", "transition", "priority",
                      "env", "service", "alert_title", "alert_body", "alert_query",
                      "host", "tags", "link"
                  },
              },
              "CHAT_INCIDENT_CANDIDATE": {
                  "source_schema": "chat.incident_candidate.v1",
                  "trigger_type": "USER_SYMPTOM_CLUSTER",
                  "evidence_fields": {
                      "candidate_id", "candidate_type", "broadcast_id",
                      "suspected_surface", "confidence", "window_start", "window_end",
                      "matched_messages", "unique_users", "strong_signal_count",
                      "weak_signal_count", "matched_rule_ids", "metric_status",
                      "root_cause", "requires_metric_corroboration"
                  },
              },
          }

          def fail(code):
              raise ValueError("CONTRACT_REJECTED:" + code)

          def require_exact_keys(value, expected, code):
              if not isinstance(value, dict) or set(value.keys()) != expected:
                  fail(code)

          def require_datetime(value, code):
              if not isinstance(value, str):
                  fail(code)
              try:
                  datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  fail(code)

          def main(custom_alert_json: str, past_cases: str = ""):
              if not isinstance(custom_alert_json, str) or not custom_alert_json:
                  fail("INPUT_NOT_STRING")
              if not isinstance(past_cases, str) or len(past_cases) > 6000:
                  fail("PAST_CASES_INVALID")
              try:
                  payload = json.loads(custom_alert_json)
              except (TypeError, json.JSONDecodeError):
                  fail("INVALID_JSON")

              require_exact_keys(payload, TOP_LEVEL_FIELDS, "TOP_LEVEL_FIELDS")
              if payload["schema_version"] != "1.0" or payload["event_type"] != "agent.incident.v1":
                  fail("SCHEMA_OR_EVENT_TYPE")
              incident_id = payload["incident_id"]
              if not isinstance(incident_id, str) or not re.fullmatch(
                  r"inc_[0-9A-HJKMNP-TV-Z]{26}", incident_id
              ):
                  fail("INCIDENT_ID")
              revision = payload["revision"]
              if not isinstance(revision, int) or isinstance(revision, bool) or revision < 1:
                  fail("REVISION")
              key = payload["idempotency_key"]
              if key != f"incident:{incident_id}:revision:{revision}":
                  fail("IDEMPOTENCY_KEY")
              require_datetime(payload["opened_at"], "OPENED_AT")
              require_datetime(payload["updated_at"], "UPDATED_AT")

              guardrails = payload["guardrails"]
              require_exact_keys(guardrails, GUARDRAIL_FIELDS, "GUARDRAIL_FIELDS")
              if guardrails != dict(
                  TRIGGER_GUARDRAILS,
                  single_incident_action_lock_required=True,
              ):
                  fail("GUARDRAIL_VALUES")

              correlation = payload["correlation"]
              if correlation.get("strategy") != "DETERMINISTIC_V1" or correlation.get("state") not in {
                  "PROVISIONAL", "CORRELATED", "AMBIGUOUS"
              }:
                  fail("CORRELATION")
              signals = payload["signals"]
              if not isinstance(signals, list) or not 1 <= len(signals) <= 20:
                  fail("SIGNALS")
              sources = set()
              for signal in signals:
                  require_exact_keys(signal, TRIGGER_FIELDS, "TRIGGER_FIELDS")
                  source = signal["source"]
                  if source not in SOURCE_RULES:
                      fail("SOURCE")
                  sources.add(source)
                  rule = SOURCE_RULES[source]
                  if signal["source_schema"] != rule["source_schema"]:
                      fail("SOURCE_SCHEMA")
                  if signal["trigger_type"] != rule["trigger_type"]:
                      fail("TRIGGER_TYPE")
                  if signal["guardrails"] != TRIGGER_GUARDRAILS:
                      fail("TRIGGER_GUARDRAILS")
                  require_exact_keys(signal["evidence"], rule["evidence_fields"], "EVIDENCE_FIELDS")
              if correlation["state"] == "CORRELATED" and not {
                  "CHAT_INCIDENT_CANDIDATE", "DATADOG_MONITOR"
              }.issubset(sources):
                  fail("CORRELATED_SOURCES")

              return {
                  "result": json.dumps({
                      "accepted": True,
                      "event_type": "agent.incident.v1",
                      "idempotency_key": key,
                      "incident_id": incident_id,
                      "revision": revision,
                      "history_context_present": bool(past_cases),
                      "status": "ACCEPTED"
                  }, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
              }
        code_language: python3
        dependencies: []
        desc: >-
          Validates Incident revision identity, nested source pairing, exact evidence
          fields, and read-only guardrails. It never returns evidence or raw input.
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 계약 검증
        type: code
        variables:
        - value_selector:
          - agent-entry-start
          - custom_alert_json
          variable: custom_alert_json
        - value_selector:
          - agent-entry-start
          - past_cases
          variable: past_cases
      height: 120
      id: agent-entry-validate
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        desc: Returns only a sanitized deterministic acceptance summary.
        outputs:
        - value_selector:
          - agent-entry-validate
          - result
          value_type: string
          variable: result
        selected: false
        title: 출력
        type: end
      height: 83
      id: agent-entry-output
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    viewport:
      x: 335
      y: 140
      zoom: 1
  rag_pipeline_variables: []
