    - data:
        code: "import json\n\ndef _logical_value(raw_json):\n    try: d=json.loads(raw_json or '{}')\n    except Exception: return None\n    return d.get('value') if d.get('status') == 'OK' else None\n\ndef _degraded_active(raw_json):\n    try: d=json.loads(raw_json or '{}')\n    except Exception: return None\n    v=d.get('read_path_degraded_active')\n    return v if isinstance(v,bool) else None\n\ndef main(warm_body: str, propagation_body: str, block_body: str, items_body: str, degraded_body: str) -> dict:\n    try: warm=json.loads(warm_body or '{}')\n    except Exception: warm={}\n    latest=warm.get('latest')\n    if not isinstance(latest,dict):\n        latest={}\n        warm['latest']=latest\n    latest['chat_propagation_p95_ms']=_logical_value(propagation_body)\n    latest['channel_block_rate']=_logical_value(block_body)\n    latest['items_per_sec']=_logical_value(items_body)\n    latest['read_path_degraded_active']=_degraded_active(degraded_body)\n    return {'merged_post_metrics_body':json.dumps(warm,ensure_ascii=False,separators=(',',':'))}\n"
        code_language: python3
        desc: Warm 현재 지표에 Datadog 전파 p95·채널 차단률과 Valkey 원본 degraded 상태를 결합한다. 결측은 0이 아니라 None으로 유지한다.
