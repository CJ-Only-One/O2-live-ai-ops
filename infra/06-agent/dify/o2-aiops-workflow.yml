    - data:
        code: "import json,re\n\ndef _obj(text):\n    t=(text or '').strip(); t=re.sub(r'^```(?:json)?\\s*','',t); t=re.sub(r'\\s*```$','',t)\n    try:return json.loads(t)\n    except Exception:\n        m=re.search(r'\\{.*\\}',t,re.S)\n        return json.loads(m.group(0)) if m else {}\n\ndef main(text: str, json_val, context_json: str) -> dict:\n    # Dify Agent 노드가 구조화 출력을 낼 때 text는 비고 json 필드에만 담아 준다.\n    # json 필드가 리스트로 오면(예: 배열 하나짜리) 첫 항목을 쓴다.\n    if isinstance(json_val, list) and json_val:\n        json_val = json_val[0]\n    if isinstance(json_val, dict) and json_val:\n        d = json_val\n    else:\n        try: d=_obj(text)\n        except Exception: d={}\n    allowed={'cache_invalidation_storm','deploy_defect','pg_external_failure','traffic_spike_overload','pod_resource_exhaustion','queue_backlog','chat_channel_overload','pod_load_skew','other'}\n    rca_category=str(d.get('rca_category','other'))\n    if rca_category not in allowed: rca_category='other'\n    rca=str(d.get('rca','')).strip() or rca_category\n    try: conf=max(0.0,min(1.0,float(d.get('confidence',0))))\n    except Exception: conf=0.0\n    sev=str(d.get('severity','HIGH')).upper(); sev=sev if sev in {'LOW','MEDIUM','HIGH','CRITICAL'} else 'HIGH'\n    rec=d.get('recurrence') if isinstance(d.get('recurrence'),dict) else {}\n    recurrence={'status':str(rec.get('status','new')) if str(rec.get('status','new')) in {'recurring','new'} else 'new','why':str(rec.get('why',''))}\n    diag={'rca_category':rca_category,'rca':rca,'confidence':conf,'severity':sev,'evidence':d.get('evidence',[]) if isinstance(d.get('evidence',[]),list) else [],\n          'hypotheses':d.get('hypotheses',[]) if isinstance(d.get('hypotheses',[]),list) else [],'recurrence':recurrence,'reason':str(d.get('reason',''))}\n    bundle={'diagnosis':diag,'context':json.loads(context_json)}\n    return {'diagnosis_bundle_json':json.dumps(bundle,ensure_ascii=False,separators=(',',':'))}\n"
        code_language: python3
