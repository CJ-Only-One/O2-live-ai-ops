        code: "import json,re\n\ndef parse_json(text: str):\n    t=(text or '').strip()\n    t=re.sub(r'^```(?:json)?\\s*','',t)\n    t=re.sub(r'\\s*```$','',t)\n    try: return json.loads(t)\n    except Exception:\n        m=re.search(r'\\{.*\\}',t,re.S)\n        return json.loads(m.group(0)) if m else {}\n\ndef main(agent_text: str, available_actions_json: str, behavior: str, attempt_log_json: str) -> dict:\n    try: r=parse_json(agent_text)\n    except Exception: r={}\n    try: avail=json.loads(available_actions_json or '[]')\n    except Exception: avail=[]\n    action_id=str(r.get('action_id',''))\n    try: attempts=json.loads(attempt_log_json or '[]')\n    except Exception: attempts=[]\n    if (behavior or '').upper()=='INVALID_ACTION_FIRST' and len(attempts)==0:\n        # 디버그 전용: 이번 인시던트의 첫 시도만 카탈로그에 없는 action_id로 강제 교체해 Guardrail DENY 경로를 검증\n        action_id='__invalid_test_action__'\n    spec=next((a for a in avail if a.get('action_id')==action_id),None)\n    if not spec:\n        return {'verdict':'DENY','risk_level':'UNKNOWN','sanitized_action_json':json.dumps({'action_id':action_id},ensure_ascii=False,separators=(',',':')),'reason':'invalid_or_unavailable_action'}\n    risk=str(spec.get('risk_level','L3')).upper()\n    if action_id=='rollback': risk='L3'\n    sanitized={'action_id':action_id,'parameters_schema':spec.get('parameters_schema',{}),'execution_target':spec.get('execution_target',{}),'blast_radius':spec.get('blast_radius','-'),'expected_effect':spec.get('expected_effect',''),'agent_reason':str(r.get('reason','')),'reason_codes':r.get('reason_codes',[]),'revert_on_failure':bool(spec.get('revert_on_failure',False))}\n    verdict='AUTO' if risk in {'L1','L2'} else 'APPROVAL' if risk=='L3' else 'DENY'\n    return {'verdict':verdict,'risk_level':risk,'sanitized_action_json':json.dumps(sanitized,ensure_ascii=False,separators=(',',':')),'reason':'catalog_policy'}\n"
