        code: "import json\n\ndef get_nested(obj, path):\n    for key in path.split('.'):\n        if isinstance(obj, dict) and key in obj:\n            obj = obj[key]\n        else:\n            return None\n    return obj\n\ndef main(sanitized_action_json: str, diagnosis_bundle_json: str) -> dict:\n    sanitized = json.loads(sanitized_action_json or '{}')\n    bundle = json.loads(diagnosis_bundle_json or '{}')\n    context = bundle.get('context') or {}\n\n    schema = sanitized.get('parameters_schema', {})\n    resolved = {}\n    errors = []\n\n    for param_name, spec in schema.items():\n        source = spec.get('source', '')\n        if source.startswith('static:'):\n            value = source[len('static:'):]\n        elif source == 'human_selected':\n            # TEMP: 사람이 강도를 직접 고르는 UI가 아직 없다. Slack 승인\n            # 단계에서 대신 사람이 실행 여부를 승인하므로(risk_level L3),\n            # 승인 전까지는 options_temp의 중간값을 임시 기본값으로 쓴다 -\n            # 실측/선택 UI 완성 전 자리채움(scenario-experiment.md 2.2).\n            options = spec.get('options_temp') or []\n            value = options[len(options) // 2] if options else None\n        else:\n            value = get_nested(context, source)\n\n        # static:500 같은 값은 문자열로 잘려나온다. 스키마 type이 int면\n        # 실제 JSON 정수로 캐스팅해야 한다 - 안 그러면 받는 쪽 검증(예:\n        # chat-gateway의 Number.isInteger)이 문자열 \"500\"을 거부한다\n        # (2026-08-24 real Dify 테스트에서 400으로 실제 확인함).\n        if value is not None and spec.get('type') in ('int', 'integer'):\n            try: value = int(value)\n            except (TypeError, ValueError): pass\n\n        if value is None and spec.get('required', False):\n            errors.append(f'{param_name}: source \"{source}\" resolved to None')\n\n        resolved[param_name] = value\n\n    return {\n        'resolved_parameters_json': json.dumps(resolved, ensure_ascii=False),\n        'resolve_error': '; '.join(errors) if errors else ''\n    }\n"
        code_language: python3
        desc: runbook_store의 parameters_schema(source 주소)를 context_json의 실제 관측값으로 치환. static:xxx는 고정값 그대로 사용, type이 int면 실제 정수로 캐스팅(문자열로 나가면 받는 쪽 검증에서 거부됨). human_selected는 아직 선택 UI가 없어 options_temp 중간값을 임시로 쓴다(TEMP) - Slack 승인(L3)이 그 대신 실행 여부를 사람이 확인한다.
        outputs:
          resolved_parameters_json:
            children: null
            type: string
          resolve_error:
            children: null
            type: string
