    - data:
        code: "import json\nfrom datetime import datetime, timezone\n\ndef _tag_value(tags_str, key):\n    prefix = key + ':'\n    for t in (tags_str or '').split(','):\n        t = t.strip()\n        if t.startswith(prefix):\n            return t[len(prefix):]\n    return None\n\ndef main(custom_alert_json: str, alert_title: str, alert_body: str, alert_query: str, priority: str, host: str, tags: str, link: str) -> dict:\n    raw=(custom_alert_json or '').strip()\n    if (alert_title or '').strip():\n        # 실제 Datadog 알림 연동 경로: alert-triage.yml과 동일한 계약(alert_title/body/query/priority/host/tags/link)\n        source='DATADOG_ALERT'\n        payload={'alert_id':'ALERT-DD-'+datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S'),'service':(host or 'api'),\n                 'alert_type':'datadog_monitor','title':alert_title,'body':(alert_body or ''),'trigger_query':(alert_query or ''),\n                 'priority':(priority or 'P2'),'broadcast_id':(_tag_value(tags,'broadcast_id') or 'LIVE-001'),'host':(host or ''),'tags':(tags or ''),'link':(link or '')}\n    elif raw:\n        parsed=None\n        parse_error=None\n        try:\n            parsed=json.loads(raw)\n        except Exception as e:\n            parse_error=str(e)\n        if isinstance(parsed, dict) and parsed.get('event_type')=='agent.incident.v1':\n            # Chat 진입점(agent.incident.v1 envelope) - Datadog 알림과 동일하게 진단+조치 경로를 그대로 탄다.\n            source='CHAT_INCIDENT'\n            nc=parsed.get('normalized_context') or {}\n            services=nc.get('services') or ['api']\n            broadcast_ids=nc.get('broadcast_ids') or ['LIVE-001']\n            signals=parsed.get('signals') or []\n            evidence=(signals[0].get('evidence') if signals else {}) or {}\n            payload={'alert_id':parsed.get('incident_id','CHAT-DEMO'),'service':services[0],\n                     'alert_type':'chat_incident_candidate','title':'Chat-detected '+str(nc.get('symptom_family','UNKNOWN'))+' on '+','.join(nc.get('suspected_surfaces') or []),\n                     'body':json.dumps(evidence,ensure_ascii=False),'trigger_query':'','priority':'P2',\n                     'broadcast_id':broadcast_ids[0],'host':'','tags':'','link':'','chat_envelope':parsed}\n        elif parsed is not None:\n            source='CUSTOM_JSON'\n            payload=parsed\n        else:\n            source='CUSTOM_JSON_ERROR'\n            payload={'alert_id':'ALERT-PARSE-ERROR','service':'unknown','title':'Invalid custom payload','parse_error':parse_error}\n    else:\n        source='NO_ALERT_DATA'\n        payload={'alert_id':'ALERT-NONE','service':'api','title':'No alert data provided'}\n    if source=='CHAT_INCIDENT':\n        incident_id='INC-'+str(payload.get('alert_id','CHAT-DEMO')).replace('inc_','')\n    else:\n        incident_id='INC-'+payload.get('alert_id','DEMO').replace('ALERT-','')\n    service=payload.get('service') or 'api'\n    broadcast_id=payload.get('broadcast_id') or 'LIVE-001'\n    ctx={'incident_id':incident_id,'source':source,'received_at':datetime.now(timezone.utc).isoformat(),\n         'service':service,'broadcast_id':broadcast_id,'alert':payload}\n    return {'incident_id':incident_id,'incident_context_json':json.dumps(ctx,ensure_ascii=False,separators=(',',':')),'service':service,'broadcast_id':broadcast_id}\n"
