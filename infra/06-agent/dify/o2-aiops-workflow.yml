    - data:
        code: "import json\n\ndef main(verification_json: str, diagnosis_bundle_json: str, runbook_json: str) -> dict:\n    v=json.loads(verification_json or '{}'); b=json.loads(diagnosis_bundle_json or '{}')\n    diag=b.get('diagnosis') or {}\n    rca_category=diag.get('rca_category','other'); rca=diag.get('rca',rca_category)\n    m=v.get('metrics',{}) if isinstance(v.get('metrics',{}),dict) else {}\n    regression=bool(v.get('regression',False))\n    def num(key,default):\n        val=m.get(key)\n        return float(val) if val is not None else default\n\n    try: rb=json.loads(runbook_json or '{}')\n    except Exception: rb={}\n    sc=rb.get('success_criteria')\n\n    _cmp={'<=':lambda a,t:a is not None and a<=t,'>=':lambda a,t:a is not None and a>=t,\n          '<':lambda a,t:a is not None and a<t,'>':lambda a,t:a is not None and a>t,\n          '==':lambda a,t:a is not None and a==t,'!=':lambda a,t:a is not None and a!=t}\n\n    if isinstance(sc, dict) and (sc.get('conditions') or sc.get('baseline_conditions')):\n        # Runbook Lookup API가 실제로 채워준 기준(현재는 일부 rca_type만 시딩됨). 있으면 이걸 우선한다.\n        results=[_cmp.get(c.get('comparison'), lambda a,t: False)(m.get(c.get('metric')), c.get('threshold')) for c in (sc.get('conditions') or [])]\n        # D-058 기준선 상대 조건 - threshold 대신 relative_to 로 지정한 다른 metric(baseline_* 이름)과 비교한다.\n        for c in (sc.get('baseline_conditions') or []):\n            results.append(_cmp.get(c.get('comparison'), lambda a,t: False)(m.get(c.get('metric')), m.get(c.get('relative_to'))))\n        logic=str(sc.get('logic','AND')).upper()\n        ok = all(results) if logic=='AND' else any(results)\n    else:\n        # 아직 API에 안 채워진 rca_type -> 기존 하드코딩 기준으로 폴백(임시, 실측 아님)\n        if rca_category=='cache_invalidation_storm':\n            ok=num('p95_ms',99999)<=250 and num('cache_hit_rate',0)>=0.80 and num('error_rate',1)<=0.03\n        elif rca_category=='deploy_defect':\n            ok=num('p95_ms',99999)<=300 and num('error_rate',1)<=0.02\n        elif rca_category=='pg_external_failure':\n            ok=num('p95_ms',99999)<=400 and num('error_rate',1)<=0.05\n        elif rca_category=='traffic_spike_overload':\n            ok=num('p95_ms',99999)<=350 and num('error_rate',1)<=0.03\n        elif rca_category=='pod_resource_exhaustion':\n            ok=num('p95_ms',99999)<=300 and num('error_rate',1)<=0.02\n        elif rca_category=='queue_backlog':\n            ok=num('p95_ms',99999)<=300 and num('error_rate',1)<=0.03\n        else: ok=False\n\n    if regression: ok=False\n    assessment={'rca_category':rca_category,'rca':rca,'resolved':bool(ok),'regression':regression,'metrics':m}\n    return {'resolved':'true' if ok else 'false','assessment_json':json.dumps(assessment,ensure_ascii=False,separators=(',',':'))}\n"
        code_language: python3
        desc: Agent가 자기 조치 성공을 판정하지 않도록 RCA별 SLO를 코드로 평가. Warm Path API가 표본 부족 시 None을 줄 수 있어(num 헬퍼로) 안전하게 '미달'로 처리한다. 임계값(250/300/400ms 등)은 옛 mock 기준 그대로라 실제 트래픽으로 재보정 필요. 2026-08-24 추가 — baseline_conditions(D-058, relative_to로 다른 metric과 비교)를 처음으로 읽어서 평가하도록 했다. 이전엔 conditions만 읽고 baseline_conditions는 런북에 있어도 그냥 무시했다.
