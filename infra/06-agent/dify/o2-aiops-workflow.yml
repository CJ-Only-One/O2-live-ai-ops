    - data:
        code: "import json\n\ndef _hot_latest_max(raw_json):\n    try:\n        d = json.loads(raw_json or '{}')\n    except Exception:\n        return None, {'error': 'hot_path_invalid_response'}\n    if d.get('status') != 'ok':\n        return None, {'error': d.get('error') or 'hot_path_unavailable'}\n    series = d.get('series') or []\n    per_pod = []\n    latest_values = []\n    for s in series:\n        points = s.get('pointlist') or []\n        if not points:\n            continue\n        latest = sorted(points, key=lambda p: p[0])[-1]\n        per_pod.append({'scope': s.get('scope'), 'value': latest[1], 'ts': latest[0]})\n        # Datadog 타임시리즈는 표본 없는 지점을 null로 채운다. None이 섞이면\n        # max()가 NoneType/float 비교로 죽는다(2026-08-25, 실제 알림에서 반복 발생) - 걸러낸다.\n        if latest[1] is not None:\n            latest_values.append(latest[1])\n    if not latest_values:\n        return None, {'error': 'hot_path_no_points'}\n    return max(latest_values), {'per_pod': per_pod}\n\ndef main(raw_tools_json: str, incident_context_json: str, hot_cpu_json: str, hot_mem_json: str) -> dict:\n    try:\n        observability=json.loads(raw_tools_json or '{}')\n    except Exception as e:\n        observability={'error':'warm_api_unavailable_or_invalid_response','detail':str(e)}\n    cpu_max, cpu_detail = _hot_latest_max(hot_cpu_json)\n    mem_max, mem_detail = _hot_latest_max(hot_mem_json)\n    observability['infra'] = {\n        'cpu_usage_max': cpu_max,\n        'cpu_detail': cpu_detail,\n        'memory_usage_max': mem_max,\n        'memory_detail': mem_detail,\n    }\n    bundle={'incident_context':json.loads(incident_context_json),'observability':observability}\n    return {'context_json':json.dumps(bundle,ensure_ascii=False,separators=(',',':'))}\n"
        code_language: python3
        desc: Warm Path API 호출이 실패하거나 body가 비어도(dry-run 등) 여기서 안전하게 degrade한다 — 예전엔 mock이 항상 유효한 JSON이라 try/except가 없었지만, 이제 실제 HTTP 응답이라 필요.
