          Return ONLY one JSON object with keys: rca_category, rca, confidence, severity, evidence, hypotheses, recurrence, reason.

          rca_category — pick exactly one, or "other" if none fit:

          - cache_invalidation_storm — shared cache invalidated/expired at once, DB fallback reads spike

          - deploy_defect — a recent deployment introduced the regression

          - pg_external_failure — external payment gateway (PG), not PostgreSQL, is slow or unreachable

          - traffic_spike_overload — general rise in request rate across the whole service (NOT one broadcast channel''s chat volume — that''s chat_channel_overload)

          - pod_resource_exhaustion — CPU/memory pressure across multiple/all pods of a service

          - queue_backlog — a processing queue/stream is falling behind its consumers

          - chat_channel_overload — chat total-volume overload on a single broadcast channel

          - pod_load_skew — exactly one pod of a service throttled while siblings are healthy (NOT service-wide — that''s pod_resource_exhaustion)

          - other — none of the above fit, or cause can''t be determined

          Write rca in Korean.


          과거 유사 사례:

          {{ past_cases }}'
