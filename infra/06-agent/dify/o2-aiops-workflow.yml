    - data:
        desc: Datadog 알림이 연동된 실제 경로에서는 alert_title이 채워져 들어오고, normalize가 이 실제 필드로 incident_context를 구성한다. behavior는 Datadog Alert 미연동 상태에서 수동으로 전체 retry 경로를 재현하기 위한 디버그 전용 입력이다(아직 Action Handler/Slack이 실연동 안 돼서 mock_action/Slack 승인 결과를 이걸로 통제한다). ALWAYS_FAIL/EXHAUST_THEN_SUCCESS/INVALID_ACTION_FIRST는 실제 인시던트 재현용이 아니라 재진단·Guardrail DENY 등 평소 잘 안 타는 state machine 경로를 강제로 검증하기 위한 것. Observability Snapshot(6번)/Verification 체인(20-PRE~22-C)은 실제 O2 Warm Path API를 호출한다 — mock 아님.
