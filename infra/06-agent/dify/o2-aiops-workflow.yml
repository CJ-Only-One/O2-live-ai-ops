    - data:
        code: "import json\n\nRCA_CATEGORY_KR = {\n    'queue_backlog': '큐 적체',\n    'deploy_defect': '배포 결함',\n    'pg_external_failure': '외부 PG 장애',\n    'traffic_spike_overload': '트래픽 급증',\n    'pod_resource_exhaustion': '파드 리소스 고갈',\n    'cache_invalidation_storm': '캐시 무효화 폭주',\n    'chat_channel_overload': '채팅 채널 총량 초과',\n    'pod_load_skew': '파드 편중(일부 파드만 저하)',\n    'other': '미분류',\n}\nREASON_KR = {\n    'DIAGNOSIS_RETRY_LIMIT': '재진단을 반복했지만 조치 후보를 찾지 못했습니다',\n    'REMEDIATION_AND_DIAGNOSIS_LIMIT': '조치·재진단 시도 횟수를 모두 소진했습니다',\n    'ACTIONS_EXHAUSTED_SAME_RCA': '같은 원인으로 재진단해도 새로운 조치 후보가 없습니다',\n    'UNKNOWN_STATE_EVENT': '알 수 없는 내부 상태 이벤트가 발생했습니다',\n    'APPROVAL_REJECTED': '담당자가 승인 요청을 거부했습니다',\n    'APPROVAL_TRANSPORT_FAILED': 'Slack 승인 요청 전송에 실패했습니다',\n    'GLOBAL_LOOP_MAX_10': '최대 반복 횟수(10회)에 도달했습니다',\n    'SLO_RECOVERED': '조치 후 지표가 정상 범위로 회복됐습니다',\n    'NO_ACTIVE_RUNBOOK': '이 원인에 대해 검증된 조치가 아직 없습니다',\n}\n# attempt_log 항목 하나의 status(상태 머신 이벤트 타입) 한글화 — reason 문구가\n# 다 비슷하게 들려도 '실제로 마지막에 무슨 일이 있었는지'는 이걸로 구체화한다.\nATTEMPT_STATUS_KR = {\n    'ACTION_DENIED': 'Guardrail이 조치를 거부',\n    'EXECUTION_FAILED': '조치 실행 자체가 실패',\n    'NO_RECOVERY': '조치는 실행됐지만 회복 기준 미달',\n    'RECONSIDER': '담당자가 재고를 요청',\n    'REDIAGNOSE': '재진단 필요 판정',\n    'RESOLVED': '해결',\n    'MANUAL_REQUIRED': '수동 조치 필요 판정',\n    'UNKNOWN_EVENT': '알 수 없는 이벤트',\n}\n\n\ndef main(final_report_json: str, final_status: str) -> dict:\n    r = json.loads(final_report_json or '{}')\n    status = final_status or r.get('status') or 'UNKNOWN'\n    if status == 'RESOLVED':\n        # 담백한 성공 알림 — 실패 알림과 같은 톤, 과장 없이 무슨 조치로 뭐가\n        # 좋아졌는지만 적는다(2026-08-25, 성공 건도 알리기로 결정).\n        incident_id = r.get('incident_id', '-')\n        rca_category_kr = RCA_CATEGORY_KR.get(r.get('rca_category', 'other'), r.get('rca_category', '-'))\n        rca_raw = r.get('rca') or '-'\n        rca = rca_raw if len(rca_raw) <= 200 else rca_raw[:200] + '…'\n        attempts = r.get('attempt_log') or []\n        last = attempts[-1] if attempts else {}\n        action_id = ((last.get('action_result') or {}).get('action_id')) or '-'\n        attempt_count = r.get('attempt_count', 0)\n        lines = [\n            ':white_check_mark: *O2 AIOps 자동 해결*',\n            f'인시던트: `{incident_id}`',\n            f'*원인 분류*: {rca_category_kr}',\n            f'*진단 요약*: {rca}',\n            f'*조치*: `{action_id}` 실행 후 지표 정상 범위 복귀 확인',\n            f'*시도 횟수*: {attempt_count}회',\n        ]\n        text = '\\n'.join(lines)\n        payload = {'text': text, 'blocks': [{'type': 'section', 'text': {'type': 'mrkdwn', 'text': text}}]}\n        return {'slack_text': text, 'slack_payload_json': json.dumps(payload, ensure_ascii=False)}\n\n    incident_id = r.get('incident_id', '-')\n    rca_category = r.get('rca_category', 'other')\n    rca_category_kr = RCA_CATEGORY_KR.get(rca_category, rca_category)\n    reason_code = r.get('reason', '')\n    reason_kr = REASON_KR.get(reason_code, reason_code or '원인 불명')\n    # 진단 Agent 프롬프트(8. Template — Diagnosis Prompt)가 rca를 원인 결론\n    # 한 문장(60자 이내)만 쓰라고 이미 강제한다 — 여기서 자르는 건 그 규칙을\n    # 안 지켰을 때의 방어선일 뿐, 요약 자체는 여기서 하지 않는다.\n    rca_raw = r.get('rca') or '-'\n    rca = rca_raw if len(rca_raw) <= 200 else rca_raw[:200] + '…'\n    attempt_count = r.get('attempt_count', 0)\n\n    # 전체 시도 이력 — 마지막 시도만 보여주면 '왜 여러 번 실패했는지' 과정이\n    # 안 보인다. attempt_log 전체를 순서대로 붙이고, 메시지 상세는 메시지\n    # 길이 통제를 위해 마지막 시도에만 붙인다.\n    attempts = r.get('attempt_log') or []\n    detail_lines = []\n    if attempts:\n        detail_lines.append(\"*시도 이력*:\")\n        for i, att in enumerate(attempts, 1):\n            action_id = ((att.get('action_result') or {}).get('action_id')) or '-'\n            status_kr = ATTEMPT_STATUS_KR.get(att.get('status', ''), att.get('status') or '-')\n            detail_lines.append(f\"  {i}. `{action_id}` — {status_kr}\")\n        last_msg = (attempts[-1].get('action_result') or {}).get('message') or attempts[-1].get('reason') or ''\n        if last_msg:\n            detail_lines.append(f\"     └ {str(last_msg)[:200]}\")\n\n    lines = [\n        \":rotating_light: *O2 AIOps 자동 조치 미해결*\",\n        f\"인시던트: `{incident_id}`\",\n        f\"*원인 분류*: {rca_category_kr}\",\n        f\"*진단 요약*: {rca}\",\n        f\"*종료 사유*: {reason_kr}\",\n        *detail_lines,\n        f\"*시도 횟수*: {attempt_count}회\",\n        \":point_right: 담당자의 확인과 직접 조치가 필요합니다.\",\n    ]\n    text = \"\\n\".join(lines)\n    payload = {\n        'text': text,\n        'blocks': [{'type': 'section', 'text': {'type': 'mrkdwn', 'text': text}}],\n    }\n    return {'slack_text': text, 'slack_payload_json': json.dumps(payload, ensure_ascii=False)}\n"
        code_language: python3
        desc: Resolved/Escalated 공통 종료 payload를 생성. 실제 DynamoDB History write 전 임시 JSON. terminal_reason 내부 코드를 한글 문구로 매핑해서 사람이 읽는 Slack 메시지에 스네이크케이스가 그대로 노출되지 않게 한다.
        outputs:
