      zIndex: 1001
    - data:
        code: "import json\n\ndef main(state_json: str, event_json: str, diagnosis_bundle_json: str) -> dict:\n    s=json.loads(state_json or '{}'); e=json.loads(event_json or '{}'); typ=e.get('type','MANUAL_REQUIRED')\n    try: db=json.loads(diagnosis_bundle_json or '{}')\n    except Exception: db={}\n    if db: s['diagnosis_bundle']=db\n    rr=int(s.get('remediation_retry',0)); dr=int(s.get('diagnosis_retry',0))\n    excluded=list(s.get('excluded_actions',[])); attempts=list(s.get('attempt_log',[])); stop=False\n    current_rca=(db.get('diagnosis') or {}).get('rca_category')\n\n    def aid():\n        x=e.get('action_result') or e.get('action') or {}\n        return x.get('action_id','') if isinstance(x,dict) else ''\n    def log(status):\n        attempts.append({'seq':len(attempts)+1,'status':status,'reason':e.get('reason',''),'operator_comment':e.get('operator_comment',''),'action_result':e.get('action_result',e.get('action',{})),'verification':e.get('verification',{})})\n    def grant_rediagnosis():\n        # 재진단을 허가하는 시점의 rca를 남긴다 - 다음 CANDIDATES_EXHAUSTED가\n        # '진짜로 새로 진단한 결과'인지 비교할 기준이 이거다. db는 이번\n        # 라운드에 재사용(캐시)됐을 수도 있는 진단이라 여기서 남겨야 다음\n        # 라운드의 신선한 진단과 정확히 비교된다.\n        s['diagnosis_retry']=dr+1; s['remediation_retry']=0; s['excluded_actions']=excluded; s['skip_diagnosis']=False\n        s['pending_rediagnosis_rca']=current_rca\n\n    if typ=='RESOLVED':\n        log('RESOLVED'); s['resolved']=True; s['final_status']='RESOLVED'; s['terminal_reason']='SLO_RECOVERED'; stop=True\n    elif typ=='MANUAL_REQUIRED':\n        log('MANUAL_REQUIRED'); s['manual_required']=True; s['final_status']='ESCALATED'; s['terminal_reason']=e.get('reason','MANUAL_REQUIRED'); stop=True\n    elif typ=='REDIAGNOSE':\n        log('REDIAGNOSE')\n        # pending_rediagnosis_rca는 '재진단을 허가한 시점'의 rca만 담는다(캐시\n        # 재사용 진단은 절대 안 담김 - grant_rediagnosis()에서만 씀). 그래서\n        # 여기서 current_rca와 같다는 건 방금 재진단을 새로 돌렸는데도 똑같은\n        # 답이 나왔다는 뜻 - 액션이 1개뿐인 rca_type(S1/S3 등)에서 후보가 아직\n        # 한 번도 재진단 안 된 채 처음 소진되는 경우와는 다르다(그땐 pending이\n        # 비어 있어 여기 안 걸린다). 실제 운영 인시던트(2026-08-23 큐 적체\n        # 건)에서 이 패턴으로 diagnosis_retry 2회를 전부 허비한 걸 확인해서\n        # 조기 종료를 추가한다.\n        same_rca_no_new_info=(e.get('reason')=='CANDIDATES_EXHAUSTED' and current_rca and current_rca==s.get('pending_rediagnosis_rca'))\n        if same_rca_no_new_info:\n            s['limit_exceeded']=True; s['final_status']='RETRY_LIMIT_EXCEEDED'; s['terminal_reason']='ACTIONS_EXHAUSTED_SAME_RCA'; stop=True\n        elif dr < 2:\n            grant_rediagnosis()\n        else:\n            s['limit_exceeded']=True; s['final_status']='RETRY_LIMIT_EXCEEDED'; s['terminal_reason']='DIAGNOSIS_RETRY_LIMIT'; stop=True\n    elif typ in {'ACTION_DENIED','EXECUTION_FAILED','NO_RECOVERY','RECONSIDER'}:\n        log(typ); a=aid()\n        if a and a not in excluded: excluded.append(a)\n        s['excluded_actions']=excluded\n        if rr < 2:\n            s['remediation_retry']=rr+1; s['skip_diagnosis']=True\n        elif dr < 2:\n            grant_rediagnosis()\n        else:\n            s['limit_exceeded']=True; s['final_status']='RETRY_LIMIT_EXCEEDED'; s['terminal_reason']='REMEDIATION_AND_DIAGNOSIS_LIMIT'; stop=True\n    else:\n        log('UNKNOWN_EVENT'); s['manual_required']=True; s['final_status']='ESCALATED'; s['terminal_reason']='UNKNOWN_STATE_EVENT'; stop=True\n\n    s['attempt_log']=attempts\n    if isinstance(e.get('action_result'),dict): s['last_action']=e['action_result']\n    if isinstance(e.get('verification'),dict): s['last_verification']=e['verification']\n    return {'next_state_json':json.dumps(s,ensure_ascii=False,separators=(',',':')),'next_stop_flag':'true' if stop else 'false'}\n"
        code_language: python3
        desc: retry/rediagnosis/manual/resolved 전이 규칙의 단일 source of truth. 분기별 Variable Assigner 중복을 제거해 상태 불일치를 방지. 재진단을 실제로 허가한 뒤(pending_rediagnosis_rca 기록) 그 결과가 또 같은 rca_category로 후보 소진되면 즉시 종료(ACTIONS_EXHAUSTED_SAME_RCA) — 캐시 재사용 진단끼리 비교하던 예전 버전은 액션 1개짜리 rca_type에서 재진단을 한 번도 못 해보고 종료되는 버그가 있어 수정함(2026-08-24).
