targets[endpoint]['url']:\n        t = special_targets[endpoint]\n        return {'resolved_url': t['url'], 'auth_header_name': t['auth_header'], 'auth_header_value': t['auth_value'], 'is_real': 'true'}\n    if endpoint and ACTION_HANDLER_URL:\n        return {'resolved_url': ACTION_HANDLER_URL + endpoint, 'auth_header_name': 'x-api-key', 'auth_header_value': ACTION_HANDLER_API_KEY, 'is_real': 'true'}\n    return {'resolved_url': '', 'auth_header_name': '', 'auth_header_value': '', 'is_real': 'false'}\n"
