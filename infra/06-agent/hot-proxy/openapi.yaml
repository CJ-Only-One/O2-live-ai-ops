# Dify Custom Tool 스키마. 물리 Datadog query는 catalog 내부에만 둔다.
openapi: 3.1.0

info:
  title: O2 Hot Path — 논리 지표 조회
  description: |
    장애 판단에 필요한 논리 지표를 조회한다. 생산 원천(APM, DogStatsD, Warm)은
    Adapter가 선택하며 Dify는 vendor query를 전달하지 않는다.
  version: "2.0.0"

servers:
  - url: http://hot-proxy:8788
    description: 같은 호스트의 SigV4 서명 중계기

paths:
  /v1/hot/datadog/metric:
    post:
      operationId: read_logical_metric
      summary: 논리 지표를 primary/fallback 경로로 조회한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metric, service]
              properties:
                metric:
                  type: string
                  enum:
                    - rps
                    - latency_p95
                    - failure_rate
                    - cache_hit_rate
                    - chat_fanout_p95
                    - chat_propagation_p95_ms
                    - block_rate
                    - items_per_sec
                    - pipeline_freshness
                service:
                  type: string
                  enum: [api, chat-gateway, order-worker, o2-canary]
                env:
                  type: string
                  default: dev
                event:
                  type: string
                  description: failure_rate 등 이벤트별 지표의 고정 enum
                window_seconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
                  default: 300
                group_by:
                  type: array
                  maxItems: 1
                  items:
                    type: string
                    enum: [pod_name]
      responses:
        "200":
          description: 조회 성공. 결측도 HTTP 200과 status=NO_DATA로 표현한다.
          content:
            application/json:
              schema:
                type: object
                required: [metric, value, unit, status, source, fallback_used]
                properties:
                  metric: {type: string}
                  value:
                    type: [number, "null"]
                  unit: {type: string}
                  status:
                    type: string
                    enum: [OK, NO_DATA]
                  window_start: {type: string, format: date-time}
                  window_end: {type: string, format: date-time}
                  point_timestamp:
                    type: [string, "null"]
                    format: date-time
                  freshness_seconds:
                    type: [integer, "null"]
                  sample_count: {type: integer}
                  source:
                    type: [string, "null"]
                  contract_version: {type: string}
                  fallback_used: {type: boolean}
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        scope: {type: string}
                        value: {type: number}
                        timestamp_ms: {type: integer}
        "400":
          description: 논리 지표명, 서비스, 태그 또는 시간 창이 계약 밖이다.
        "500":
          description: Datadog 호출 실패 또는 키 조회 실패

  /v1/hot/health:
    get:
      operationId: hot_api_health
      summary: Hot Path API 상태 확인
      responses:
        "200":
          description: 정상
