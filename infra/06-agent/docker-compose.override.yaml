# Bedrock Agent(Beta) 임시 패치.
#
# Dify 1.16.1 의 agent_backend 가 도구 설명/시스템 프롬프트를 빈 문자열로 보내면
# Bedrock Converse API 가 ValidationException 으로 통째로 거부한다
# (docs/troubleshooting.md T-019, upstream langgenius/dify#40389).
# 고치는 PR(langgenius/dify#39704, #40062)이 아직 릴리스에 안 들어가 있어서
# 컨테이너 기동 시 site-packages 안 소스를 직접 고쳐 붙인다.
#
# 위 PR이 1.16.1 이후 릴리스에 들어가면 이 파일을 지우고 dify_ref 만 올리면 된다.
#
# 배포: 이 파일을 /opt/dify/docker/docker-compose.override.yaml 로 올린 뒤
#   cd /opt/dify/docker && docker compose up -d --force-recreate agent_backend
# (restart 만으로는 새 엔트리포인트가 안 먹는다 — 컨테이너를 다시 만들어야 한다)

services:
  agent_backend:
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /app/api/.venv/bin/python3 - <<'PATCH'
        import pathlib

        path = pathlib.Path(
            "/app/api/.venv/lib/python3.12/site-packages/dify_agent/adapters/llm/model.py"
        )
        src = path.read_text(encoding="utf-8")
        changed = False

        old_tool = 'description=tool_definition.description or "",'
        new_tool = "description=tool_definition.description or tool_definition.name,"
        if new_tool in src:
            pass
        elif old_tool in src:
            src = src.replace(old_tool, new_tool, 1)
            changed = True
        else:
            raise SystemExit(f"[bedrock-patch] tool-description anchor not found in {path}")

        old_sys = (
            "        if isinstance(part, SystemPromptPart):\n"
            "            prompt_messages.append(SystemPromptMessage(content=part.content))\n"
        )
        new_sys = (
            "        if isinstance(part, SystemPromptPart):\n"
            "            if part.content.strip():\n"
            "                prompt_messages.append(SystemPromptMessage(content=part.content))\n"
        )
        if new_sys in src:
            pass
        elif old_sys in src:
            src = src.replace(old_sys, new_sys, 1)
            changed = True
        else:
            raise SystemExit(f"[bedrock-patch] system-prompt anchor not found in {path}")

        if changed:
            path.write_text(src, encoding="utf-8")
            print("[bedrock-patch] applied (tool description fallback + empty system prompt filter)")
        else:
            print("[bedrock-patch] already applied, skipping")
        PATCH
        exec /app/api/.venv/bin/uvicorn dify_agent.server.app:app --host 0.0.0.0 --port 5050
